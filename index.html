<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>K7 Loadstring Manager</title>
    <style>
        body { display: flex; font-family: sans-serif; margin: 0; background: #121212; color: #fff; }
        #sidebar { width: 250px; background: #1e1e1e; border-right: 1px solid #333; height: 100vh; padding: 15px; }
        #main { flex-grow: 1; padding: 20px; display: flex; flex-direction: column; }
        textarea { flex-grow: 1; background: #252525; color: #fff; border: 1px solid #444; padding: 10px; font-family: monospace; resize: none; }
        .controls { margin-top: 10px; display: flex; gap: 10px; }
        button { padding: 10px 20px; cursor: pointer; background: #007acc; color: white; border: none; }
        .file-item { padding: 8px; cursor: pointer; border-bottom: 1px solid #333; }
        .file-item:hover { background: #333; }
    </style>
</head>
<body>

<div id="sidebar">
    <h3>Dosyalarım</h3>
    <div id="fileList"></div>
    <button onclick="newFile()" style="width: 100%; margin-top: 10px;">Yeni Dosya</button>
</div>

<div id="main">
    <h2>k7 loadstring</h2>
    <textarea id="editor" placeholder="Kodunu buraya yaz (200k limite kadar)..."></textarea>
    <div class="controls">
        <button onclick="saveFile()">Dosyayı Kaydet</button>
        <button onclick="copyText()">Kopyala</button>
    </div>
</div>

<script>
    let files = JSON.parse(localStorage.getItem('k7_files')) || {};
    let currentFile = 'script1';

    function renderFiles() {
        const list = document.getElementById('fileList');
        list.innerHTML = '';
        for (let name in files) {
            let div = document.createElement('div');
            div.className = 'file-item';
            div.innerText = name;
            div.onclick = () => loadFile(name);
            list.appendChild(div);
        }
    }

    function newFile() {
        let name = prompt("Dosya adı:");
        if (name && !files[name]) {
            files[name] = '';
            currentFile = name;
            saveState();
            renderFiles();
            document.getElementById('editor').value = '';
        }
    }

    function loadFile(name) {
        currentFile = name;
        document.getElementById('editor').value = files[name];
    }

    function saveFile() {
        files[currentFile] = document.getElementById('editor').value;
        saveState();
        alert("Kaydedildi!");
    }

    function saveState() {
        localStorage.setItem('k7_files', JSON.stringify(files));
    }

    function copyText() {
        let copyText = document.getElementById("editor");
        copyText.select();
        navigator.clipboard.writeText(copyText.value);
        alert("Kod kopyalandı!");
    }

    if(Object.keys(files).length === 0) {
        files['script1'] = '';
        saveState();
    }
    renderFiles();
    loadFile(currentFile);
</script>

</body>
</html>
